# AI Lab: device-only spike app for on-device model engines (spike #12, #13), encryption (#16),
# evidence (#17) and documents (#15).
# Separate project on purpose: the engines have no iOS Simulator support, and keeping them out of
# the main project keeps the main app, its tests and CI fast and simulator-friendly.
name: MissionCopilotAILab
options:
  bundleIdPrefix: com.lubobali
  deploymentTarget:
    iOS: "18.0"
configFiles:
  Debug: ../Config/Base.xcconfig
  Release: ../Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.32.3
  Transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.5
  EncryptionLab:
    path: EncryptionLab
  DocumentLab:
    path: DocumentLab
  SpeechLab:
    path: SpeechLab
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.1.1
targets:
  MissionCopilotAILab:
    type: application
    entitlements:
      path: Entitlements/AILab.entitlements
      properties:
        # ADR 0008 layer 1: every file the app creates is unreadable while the phone is locked.
        com.apple.developer.default-data-protection: NSFileProtectionComplete
    platform: iOS
    sources:
      - Sources
      # Story #47: the main app's model-signature check, the same file, timed on the real model.
      - path: ../MissionCopilot/Platform/ModelSignature.swift
      - path: ../MissionCopilot/Platform/ModelSigningKey.swift
      # Spike #15: the committed scan documents and answer key, read on the phone.
      - path: ../../docs/demo/scans
        buildPhase: resources
      - path: ../../docs/demo/audio
        type: folder
        buildPhase: resources
      # Story #48: the injection set, as its own folder (its answer-key.json must not clash).
      - path: ../../docs/demo/injection
        type: folder
        buildPhase: resources
    dependencies:
      # Pinned llama.cpp b11960 (= stable v0.8.0, commit 8642541b), device slice only.
      - framework: ../../models/llama.xcframework
        embed: true
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXGuidedGeneration
      - package: Transformers
        product: Tokenizers
      - package: ArgmaxOSS
        product: WhisperKit
      - package: EncryptionLab
      - package: DocumentLab
      - package: SpeechLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lubobali.missioncopilot.ailab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MC AI Lab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Scan test documents for the reading spike.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record a test voice debrief for the speech spike.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Transcribe test debriefs on this iPhone, offline.
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SUPPORTED_PLATFORMS: iphoneos

  # Same lab without MLX (no Metal Toolchain needed): runs the llama.cpp half on its own.
  MissionCopilotAILabLlama:
    type: application
    entitlements:
      path: Entitlements/AILabLlama.entitlements
      properties:
        # ADR 0008 layer 1: every file the app creates is unreadable while the phone is locked.
        com.apple.developer.default-data-protection: NSFileProtectionComplete
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - MLXEngine.swift
          - TokenizerAdapter.swift
      - path: ../../docs/demo/scans
        buildPhase: resources
      - path: ../../docs/demo/audio
        type: folder
        buildPhase: resources
    dependencies:
      - framework: ../../models/llama.xcframework
        embed: true
      - package: EncryptionLab
      - package: DocumentLab
      - package: SpeechLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lubobali.missioncopilot.ailab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MC AI Lab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Scan test documents for the reading spike.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record a test voice debrief for the speech spike.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Transcribe test debriefs on this iPhone, offline.
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SUPPORTED_PLATFORMS: iphoneos
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) NO_MLX
