name: MissionCopilot
options:
  bundleIdPrefix: com.lubobali
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
# Three builds (#104): Debug (the laptop's server), Staging (its own app, the staging server), Release
# (production only). Each settings file starts from Base and then sets its server.
configs:
  Debug: debug
  Staging: release
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Staging: Config/Staging.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.5.0"  # the phase; packs name the oldest app version that may read them
    # The build number (CFBundleVersion), sent as X-App-Build (#104): a whole number, raised by one for every
    # build handed out, so the server can refuse a build that is too old. 2: the first that sends it.
    CURRENT_PROJECT_VERSION: "2"
packages:
  # GRDB 7.12.0 linked to SQLCipher 4.20.0 (exact): our fork changes only Package.swift, as GRDB's
  # README says to for SQLCipher with SPM. Pinned by commit; recorded in docs/sbom/app.cdx.json.
  GRDB:
    url: https://github.com/lubobali/GRDB.swift
    revision: 743e132654bb30469ce64e2294e14d8ad0aa4d95
  # The on-device model's libraries (#136), at exactly the versions the AI Lab proved on the iPhone
  # (mlx-swift-lm 3.32.3, swift-transformers 1.3.5) and every package they pull in, each pinned by commit
  # here so none can move on its own (scripts/check_bom.py); recorded in docs/sbom/app.cdx.json.
  MLXSwiftLM:  # 3.32.3
    url: https://github.com/ml-explore/mlx-swift-lm
    revision: 3b339ad6e3b3f44c8121ecff5131c7fd55e075e6
  MLXSwift:  # 0.32.3
    url: https://github.com/ml-explore/mlx-swift
    revision: 19601207e9a0de51e03ee6ec0c3c5f3784275075
  Transformers:  # 1.3.5
    url: https://github.com/huggingface/swift-transformers
    revision: 48473106a93b2d8dfb114b82f0628ebbb71734e7
  SwiftHuggingFace:  # 1.0.0
    url: https://github.com/huggingface/swift-huggingface
    revision: c30143a4616f3fa994ee3ab3e3464f752845c07c
  SwiftJinja:  # 2.5.2
    url: https://github.com/huggingface/swift-jinja.git
    revision: 1e4d0dc69f7ec1277131fb3853808229c5991825
  SwiftCollections:  # 1.7.5
    url: https://github.com/apple/swift-collections.git
    revision: f96b909e1a9e469620bc5037c1e24e00153f376f
  SwiftNumerics:  # 1.1.1
    url: https://github.com/apple/swift-numerics
    revision: 0c0290ff6b24942dadb83a929ffaaa1481df04a2
  SwiftCrypto:  # 4.5.2
    url: https://github.com/apple/swift-crypto.git
    revision: da9d28d69ebe3894b18376c8f2395c2f37b8448f
  SwiftASN1:  # 1.7.3
    url: https://github.com/apple/swift-asn1.git
    revision: 3b6410f7dee09eb33cdd26260c5fd47fda19b0e2
  SwiftSyntax:  # 603.0.2
    url: https://github.com/swiftlang/swift-syntax.git
    revision: 79e4b74a295b6eb74a8b585e3a39d29e70c1dbd1
  EventSource:  # 1.5.1
    url: https://github.com/mattt/EventSource.git
    revision: 86b5096ac59ab46e66bd1f6377c604bc1dab0bc2
  YYJSON:  # 0.12.0
    url: https://github.com/ibireme/yyjson.git
    revision: 8b4a38dc994a110abaec8a400615567bd996105f
targets:
  MissionCopilot:
    type: application
    platform: iOS
    entitlements:
      path: Entitlements/MissionCopilot.entitlements
      properties:
        # ADR 0008 layer A: every file the app creates is unreadable while the phone is locked.
        com.apple.developer.default-data-protection: NSFileProtectionComplete
    sources:
      - path: MissionCopilot
      # The pack sections schema itself, not a copy (#92): the phone checks pack files against the same
      # file the server's tests use.
      - path: ../docs/api/pack-sections.schema.json
        buildPhase: resources
      # The red-flag rules (#134, ADR 0010): the same file the ADR guard checks, not a copy.
      - path: ../docs/rules/red-flag-rules.json
        buildPhase: resources
    dependencies:
      - package: GRDB
        product: GRDB
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXGuidedGeneration
      - package: Transformers
        product: Tokenizers
    # The on-device model ships inside the app (#125; Lubo, Nov 5). Only its signed files and the
    # signature are copied, for Staging and Release; Debug and a Mac without the model ship none, and the
    # app says so. The app checks the signature before it trusts the model (threat model T46).
    postBuildScripts:
      - name: Bundle the signed AI model
        basedOnDependencyAnalysis: false
        script: |
          /usr/bin/python3 "$SRCROOT/../scripts/bundle_model.py" "$CONFIGURATION" \
            "$SRCROOT/../models/mlx/LFM2.5-1.2B-Instruct-4bit" \
            "$SRCROOT/../docs/models/LFM2.5-1.2B-Instruct-4bit.sig" \
            "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Models"
    settings:
      base:
        # The model bundler reads ../models and ../docs, outside the project: not possible sandboxed.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.lubobali.missioncopilot
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mission Copilot
        INFOPLIST_FILE: Config/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_NSCameraUsageDescription: Scan documents and take site photos as signed evidence.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record a short voice debrief after a meeting.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Turn your voice debrief into notes on this phone.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Attach the site location to photos you take as evidence.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Face ID unlocks your missions, so only you can open them on this iPhone.
      configs:
        Debug:
          # Debug only: lets Finder copy large model files into the app (spikes).
          INFOPLIST_FILE: Config/Info-Debug.plist
          INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        Staging:
          # Its own app: its own keychain and chip keys, never production's (#104).
          PRODUCT_BUNDLE_IDENTIFIER: com.lubobali.missioncopilot.staging
          INFOPLIST_KEY_CFBundleDisplayName: MC Staging
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) STAGING
  MissionCopilotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MissionCopilotTests
        excludes: ["Fixtures/**"]
      # Kept as one folder so the fixture model keeps its shape inside the test bundle.
      - path: MissionCopilotTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: MissionCopilot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MissionCopilot:
    build:
      targets:
        MissionCopilot: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [MissionCopilotTests]
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  # No test action: the tests need a debug build (testability). They run on Debug.
  MissionCopilot Staging:
    build:
      targets:
        MissionCopilot: all
    run:
      config: Staging
    profile:
      config: Staging
    analyze:
      config: Staging
    archive:
      config: Staging
