name: MissionCopilot
options:
  bundleIdPrefix: com.lubobali
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
# Three builds (#104): Debug (the laptop's server), Staging (its own app, the staging server), Release
# (production only). Each settings file starts from Base and then sets its server.
configs:
  Debug: debug
  Staging: release
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Staging: Config/Staging.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.5.0"  # the phase; packs name the oldest app version that may read them
    CURRENT_PROJECT_VERSION: "1"
packages:
  # GRDB 7.12.0 linked to SQLCipher 4.20.0 (exact): our fork changes only Package.swift, as GRDB's
  # README says to for SQLCipher with SPM. Pinned by commit; recorded in docs/sbom/app.cdx.json.
  GRDB:
    url: https://github.com/lubobali/GRDB.swift
    revision: 743e132654bb30469ce64e2294e14d8ad0aa4d95
targets:
  MissionCopilot:
    type: application
    platform: iOS
    entitlements:
      path: Entitlements/MissionCopilot.entitlements
      properties:
        # ADR 0008 layer A: every file the app creates is unreadable while the phone is locked.
        com.apple.developer.default-data-protection: NSFileProtectionComplete
    sources:
      - path: MissionCopilot
      # The pack sections schema itself, not a copy (#92): the phone checks pack files against the same
      # file the server's tests use.
      - path: ../docs/api/pack-sections.schema.json
        buildPhase: resources
    dependencies:
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lubobali.missioncopilot
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mission Copilot
        INFOPLIST_FILE: Config/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_NSCameraUsageDescription: Scan documents and take site photos as signed evidence.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record a short voice debrief after a meeting.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Turn your voice debrief into notes on this phone.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Attach the site location to photos you take as evidence.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Face ID unlocks your missions, so only you can open them on this iPhone.
      configs:
        Debug:
          # Debug only: lets Finder copy large model files into the app (spikes).
          INFOPLIST_FILE: Config/Info-Debug.plist
          INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        Staging:
          # Its own app: its own keychain and chip keys, never production's (#104).
          PRODUCT_BUNDLE_IDENTIFIER: com.lubobali.missioncopilot.staging
          INFOPLIST_KEY_CFBundleDisplayName: MC Staging
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) STAGING
  MissionCopilotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MissionCopilotTests
        excludes: ["Fixtures/**"]
      # Kept as one folder so the fixture model keeps its shape inside the test bundle.
      - path: MissionCopilotTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: MissionCopilot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MissionCopilot:
    build:
      targets:
        MissionCopilot: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [MissionCopilotTests]
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  # No test action: the tests need a debug build (testability). They run on Debug.
  MissionCopilot Staging:
    build:
      targets:
        MissionCopilot: all
    run:
      config: Staging
    profile:
      config: Staging
    analyze:
      config: Staging
    archive:
      config: Staging
