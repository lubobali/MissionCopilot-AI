# Quality gate: runs on every commit. A commit is blocked if any hook fails.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-merge-conflict" },
    { id = "check-toml" },
    { id = "check-yaml" },
    { id = "detect-private-key" },
    # Model files are 700 MB+, they must never land in git.
    { id = "check-added-large-files", args = ["--maxkb=1024"] },
]

[[repos]]
repo = "local"
hooks = [
    # Secrets: scan exactly what is being committed.
    { id = "gitleaks", name = "gitleaks (secret scan)", entry = "gitleaks git --staged --redact --no-banner", language = "system", pass_filenames = false },
    # Backend: lint, format, types, tests (only when backend files change).
    { id = "ruff-check", name = "ruff lint", entry = "uv run --directory backend ruff check .", language = "system", pass_filenames = false, files = "^backend/" },
    { id = "ruff-format", name = "ruff format", entry = "uv run --directory backend ruff format --check .", language = "system", pass_filenames = false, files = "^backend/" },
    { id = "ty", name = "ty (types)", entry = "uv run --directory backend ty check", language = "system", pass_filenames = false, files = "^backend/" },
    { id = "pytest", name = "pytest (backend + API contract)", entry = "uv run --directory backend pytest -q", language = "system", pass_filenames = false, files = "^(backend/|docs/api/|docs/demo/)" },
    # Repo-wide guards (same commands as CI, so local and CI never drift).
    { id = "file-size", name = "file size guard (300 lines)", entry = "python3 scripts/check_file_size.py", language = "system", pass_filenames = false, always_run = true },
    { id = "adr-guard", name = "ADR guard (required sections)", entry = "python3 scripts/check_adrs.py", language = "system", pass_filenames = false, files = "^docs/adr/" },
    { id = "pytest-scripts", name = "pytest (scripts)", entry = "uv run --directory backend pytest -c pyproject.toml -q ../scripts", language = "system", pass_filenames = false, files = "^scripts/" },
    { id = "ruff-scripts", name = "ruff (scripts)", entry = "uv run --directory backend ruff check ../scripts", language = "system", pass_filenames = false, files = "^scripts/" },
    # iOS: lint and tests (only when ios/ changes). Tests run on the iPhone 13 Pro Max simulator.
    { id = "swiftlint", name = "swiftlint (strict)", entry = "bash -c 'cd ios && swiftlint lint --strict --quiet'", language = "system", pass_filenames = false, files = "^ios/" },
    { id = "ios-tests", name = "iOS tests (simulator)", entry = "bash -c 'cd ios && xcodegen generate -q && xcodebuild test -project MissionCopilot.xcodeproj -scheme MissionCopilot -destination \"platform=iOS Simulator,name=iPhone 13 Pro Max\" -quiet'", language = "system", pass_filenames = false, files = "^ios/" },
    # Spike #16 encryption package: SQLCipher tests plus Keychain tests in a signed simulator host.
    { id = "encryption-lab-tests", name = "encryption lab tests (simulator)", entry = "ios/AILab/EncryptionLab/test.sh", language = "system", pass_filenames = false, files = "^ios/AILab/EncryptionLab/" },
]
