[project]
name = "missioncopilot-backend"
version = "0.1.0"
description = "Sync backend for MissionCopilot-AI: mission packs, approvals, audit log"
readme = "README.md"
authors = [
    { name = "Lubo Bali" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "jsonschema>=4.26.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pyjwt[crypto]>=2.15.1",
    "pyxform>=4.5.0",
    "uvicorn>=0.54.0",
    "webauthn==3.0.1",
]

[project.scripts]
missioncopilot-backend = "missioncopilot_backend:main"
missioncopilot-admin = "missioncopilot_backend.admin:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# One uv everywhere: the Mac, CI (setup-uv reads this file), the image and the server.
# scripts/check_uv_pin.py keeps them equal.
required-version = "==0.13.6"
# The image is Linux: `uv lock` fails if a package has no wheel for the server (x86_64) or for
# Docker on an Apple Mac (aarch64), instead of the image build failing later.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "openapi-spec-validator>=0.9.0",
    "pillow>=13.0.0",
    "pytest>=9.2.0",
    "pytest-randomly>=5.0.0",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# Strict: typo'd markers/config fail at collection. Slow and e2e are opt-in.
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not slow and not e2e", "--durations=5"]
xfail_strict = true
markers = [
    # Category: exactly ONE per test module
    "unit: pure logic, no I/O, parallel-safe",
    "db: needs Postgres",
    # Labels
    "integration: more than one module or a real service",
    "regression: protects against one specific past bug (tests/integration/regressions/)",
    "slow: calls real external APIs (NIM, KoBo), run with -m slow",
    "e2e: hits a deployed backend, run with -m e2e",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "C90"]

# B008: FastAPI's Depends()/Header() in default args is the framework idiom, not a bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"**/test_*.py" = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10
