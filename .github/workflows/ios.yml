name: iOS

# Runs only when iOS code or this workflow changes. macOS runners can queue for minutes,
# so docs and backend changes skip this workflow and get feedback from ci.yml in seconds.

permissions: {}

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "docs/demo/scans/**"
      - "docs/demo/audio/**"
      - ".github/workflows/ios.yml"
      - "scripts/check_ios_build_settings.py"
      - "scripts/ios_ci_paths.py"
      - "scripts/newest_iphone.py"
  pull_request:
    paths:
      - "ios/**"
      - "docs/demo/scans/**"
      - "docs/demo/audio/**"
      - ".github/workflows/ios.yml"
      - "scripts/check_ios_build_settings.py"
      - "scripts/ios_ci_paths.py"
      - "scripts/newest_iphone.py"
  # The full safety net (#127): every lab test runs weekly and on demand, as on every push to main.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Do the lab tests need to run? A PR that changes only the app skips them (about 10 of the 20
  # minutes); push to main, the weekly run and a manual run always run them (#127).
  changes:
    name: Which iOS tests run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      labs: ${{ steps.rule.outputs.labs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the PR's merge base must be here
          persist-credentials: false
      - name: Do the labs need to run? (scripts/ios_ci_paths.py)
        id: rule
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ios_ci_paths.py "$EVENT" "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  ios:
    name: iOS lint and tests (simulator)
    # Pinned image and pinned Xcode: "latest" moves, pinned stays reproducible. macos-15 defaulted to
    # Xcode 16.4 (iOS 18.5 SDK) while development uses Xcode 27.2; the document reader needs the iOS 26
    # SDK. Xcode 26.6 is the newest on GitHub runners; move to Xcode 27 when the image offers it.
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
      SWIFTLINT_VERSION: "0.65.1"
      SWIFTLINT_SHA256: "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0"
      XCODE_APP: /Applications/Xcode_26.6.app
      TOOLS_DIR: ${{ github.workspace }}/../ios-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cache the downloaded zips by version. They are SHA-256 verified on every run,
      # whether they came from the cache or from GitHub, so a bad cache cannot slip through.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TOOLS_DIR }}
          key: ios-tools-xcodegen-${{ env.XCODEGEN_VERSION }}-swiftlint-${{ env.SWIFTLINT_VERSION }}

      - name: Install XcodeGen and SwiftLint (pinned, SHA-256 verified)
        run: |
          set -euo pipefail
          mkdir -p "$TOOLS_DIR"
          cd "$TOOLS_DIR"
          [ -f xcodegen.zip ] || curl -fsSLo xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  xcodegen.zip" | shasum -a 256 --check
          [ -f swiftlint.zip ] || curl -fsSLo swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  swiftlint.zip" | shasum -a 256 --check
          unzip -qo xcodegen.zip -d "$RUNNER_TEMP/xcodegen"
          unzip -qo swiftlint.zip -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: Select Xcode (pinned)
        run: sudo xcode-select -s "$XCODE_APP"

      - name: Tool versions
        run: |
          xcodebuild -version
          xcodegen --version
          swiftlint version

      - name: SwiftLint (strict)
        working-directory: ios
        run: swiftlint lint --strict --quiet

      - name: Generate Xcode project from project.yml
        working-directory: ios
        run: xcodegen generate

      - name: Staging and Release talk only to their own server (#104)
        working-directory: ios
        run: |
          set -euo pipefail
          for config in Staging Release; do
            xcodebuild -showBuildSettings -json -project MissionCopilot.xcodeproj \
              -target MissionCopilot -configuration "$config" \
              | python3 "$GITHUB_WORKSPACE/scripts/check_ios_build_settings.py" "$config"
          done

      # Built once for a generic simulator (arm64 only: the runner is Apple silicon), so it needs no
      # device and runs while the simulator boots; build and test time are measured apart (#127).
      # Ad-hoc signed, no team or certificate: an unsigned test app gets no Keychain (-34018),
      # and the encrypted store's tests need one (#68).
      - name: Build the app for testing
        working-directory: ios
        run: |
          set -euo pipefail
          start=$SECONDS
          xcodebuild build-for-testing \
            -project MissionCopilot.xcodeproj \
            -scheme MissionCopilot \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -showBuildTimingSummary \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
          echo "::notice title=App build::$((SECONDS - start)) s"

      # On its own, after the build (measured twice, #127): on the 3-core runner a simulator's first
      # boot beside other work slowed both, so nothing runs beside it.
      - name: Boot the simulator
        run: |
          set -euo pipefail
          # The runner's simulator list changes over time: pick an iPhone on the newest iOS runtime.
          udid=$(xcrun simctl list devices available -j | python3 "$GITHUB_WORKSPACE/scripts/newest_iphone.py")
          echo "Simulator: $udid"
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$udid" -b  # boots it and waits until it is ready

      - name: Test on an iPhone simulator
        working-directory: ios
        run: |
          set -euo pipefail
          start=$SECONDS
          xcodebuild test-without-building \
            -project MissionCopilot.xcodeproj \
            -scheme MissionCopilot \
            -destination "id=${UDID}" \
            -derivedDataPath "$RUNNER_TEMP/dd"
          echo "::notice title=App tests::$((SECONDS - start)) s"

  # The labs' own tests (spikes 14 to 16), beside the app, when the rule says so.
  labs:
    name: iOS lab tests (simulator)
    needs: [changes]
    if: needs.changes.outputs.labs == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
      XCODE_APP: /Applications/Xcode_26.6.app
      TOOLS_DIR: ${{ github.workspace }}/../ios-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Encryption lab's host app is generated by XcodeGen: the same pinned, SHA-256 checked zip.
      - name: Install XcodeGen (pinned, SHA-256 verified)
        run: |
          set -euo pipefail
          mkdir -p "$TOOLS_DIR"
          cd "$TOOLS_DIR"
          curl -fsSLo xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  xcodegen.zip" | shasum -a 256 --check
          unzip -qo xcodegen.zip -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Select Xcode (pinned)
        run: sudo xcode-select -s "$XCODE_APP"

      # On its own, after the build (measured twice, #127): on the 3-core runner a simulator's first
      # boot beside other work slowed both, so nothing runs beside it.
      - name: Boot the simulator
        run: |
          set -euo pipefail
          # The runner's simulator list changes over time: pick an iPhone on the newest iOS runtime.
          udid=$(xcrun simctl list devices available -j | python3 "$GITHUB_WORKSPACE/scripts/newest_iphone.py")
          echo "Simulator: $udid"
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$udid" -b  # boots it and waits until it is ready

      - name: Encryption lab tests (spike 16, SQLCipher + Keychain)
        run: ios/AILab/EncryptionLab/test.sh "id=${UDID}"

      - name: Document lab tests (spike 15, Vision reads the scan documents)
        run: ios/AILab/DocumentLab/test.sh "id=${UDID}"

      - name: Speech lab tests (spike 14, WER and key facts)
        run: ios/AILab/SpeechLab/test.sh "id=${UDID}"

  # One check for "did everything needed pass": a skipped lab job is fine, a failed or cancelled one
  # is not. Ready to be the one required check when main gets branch protection.
  result:
    name: iOS result
    needs: [changes, ios, labs]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every needed iOS job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              failure|cancelled) echo "::error::An iOS job did not pass ($result)"; exit 1 ;;
            esac
          done
