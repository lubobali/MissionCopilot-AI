name: CI

# Fast quality gate: runs on every push and pull request (about 15 seconds).
# The iOS checks live in ios.yml and run only when iOS code changes.

# Least privilege: the workflow gets no permissions; each job asks for the minimum.
permissions: {}

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  PREK_VERSION: "0.5.9"

jobs:
  backend:
    name: Quality gate (same hooks as local commits)
    # Pinned OS image: "latest" moves (Ubuntu 26 migration), pinned stays reproducible.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Actions pinned to a commit SHA, not a moving tag. No token left in git config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history for the secret scan

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies (exact versions from the lockfile)
        run: uv sync --locked --directory backend

      - name: Start Postgres for the database tests (same pinned image as backend/compose.yaml)
        # A fresh random password every run, masked in the log; reachable from this runner only.
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          echo "::add-mask::${password}"
          docker run --detach --name postgres --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER=missioncopilot_admin --env POSTGRES_PASSWORD="${password}" \
            postgres:18.6-trixie@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
          for _ in $(seq 60); do
            docker exec postgres pg_isready -U missioncopilot_admin -d postgres -q && break
            sleep 1
          done
          docker exec postgres pg_isready -U missioncopilot_admin -d postgres
          echo "MISSIONCOPILOT_TEST_ADMIN_URL=postgresql://missioncopilot_admin:${password}@127.0.0.1:5432/postgres" >> "${GITHUB_ENV}"

      - name: Install gitleaks (checksum verified) and prek
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check
          tar -xzf "${tarball}" gitleaks
          sudo mv gitleaks /usr/local/bin/
          uv tool install "prek==${PREK_VERSION}"

      - name: Secret scan (full git history)
        run: gitleaks git --redact --no-banner .

      - name: All commit hooks on every file (lint, format, types, tests, size guard)
        # Skipped here and covered elsewhere: gitleaks (full-history scan above),
        # swiftlint, ios-tests and the three AI Lab package tests (need a Mac; ios.yml runs them).
        run: prek run --all-files --skip gitleaks --skip swiftlint --skip ios-tests --skip encryption-lab-tests --skip document-lab-tests --skip speech-lab-tests

      - name: App startup check
        run: uv run --directory backend python ../scripts/startup_check.py

      - name: Workflow security lint (zizmor)
        run: uvx zizmor@1.31.1 --offline .github/workflows
