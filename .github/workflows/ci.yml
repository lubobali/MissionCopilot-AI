name: CI

# Least privilege: the workflow gets no permissions; each job asks for the minimum.
permissions: {}

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  PREK_VERSION: "0.5.9"

jobs:
  backend:
    name: Quality gate (same hooks as local commits)
    # Pinned OS image: "latest" moves (Ubuntu 26 migration), pinned stays reproducible.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Actions pinned to a commit SHA, not a moving tag. No token left in git config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history for the secret scan

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies (exact versions from the lockfile)
        run: uv sync --locked --directory backend

      - name: Install gitleaks (checksum verified) and prek
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check
          tar -xzf "${tarball}" gitleaks
          sudo mv gitleaks /usr/local/bin/
          uv tool install "prek==${PREK_VERSION}"

      - name: Secret scan (full git history)
        run: gitleaks git --redact --no-banner .

      - name: All commit hooks on every file (lint, format, types, tests, size guard)
        # The staged-only gitleaks hook is skipped here; the full-history scan above covers it.
        run: prek run --all-files --skip gitleaks

      - name: App startup check
        run: uv run --directory backend python ../scripts/startup_check.py

      - name: Workflow security lint (zizmor)
        run: uvx zizmor@1.31.1 --offline .github/workflows

  ios:
    name: iOS lint and tests (simulator)
    # Pinned image, same reason as the backend job.
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
      SWIFTLINT_VERSION: "0.65.1"
      SWIFTLINT_SHA256: "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install XcodeGen and SwiftLint (pinned, SHA-256 verified)
        run: |
          set -euo pipefail
          curl -fsSLo xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  xcodegen.zip" | shasum -a 256 --check
          unzip -q xcodegen.zip -d "$RUNNER_TEMP/xcodegen"
          curl -fsSLo swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  swiftlint.zip" | shasum -a 256 --check
          unzip -q swiftlint.zip -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          xcodebuild -version
          xcodegen --version
          swiftlint version

      - name: SwiftLint (strict)
        working-directory: ios
        run: swiftlint lint --strict --quiet

      - name: Generate Xcode project from project.yml
        working-directory: ios
        run: xcodegen generate

      - name: Test on an iPhone simulator
        working-directory: ios
        run: |
          set -euo pipefail
          # The runner's simulator list changes over time, so pick the first available iPhone.
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r,v in d.items() if 'iOS' in r for x in v if x['name'].startswith('iPhone')))")
          echo "Simulator: $udid"
          xcodebuild test \
            -project MissionCopilot.xcodeproj \
            -scheme MissionCopilot \
            -destination "id=${udid}" \
            CODE_SIGNING_ALLOWED=NO
