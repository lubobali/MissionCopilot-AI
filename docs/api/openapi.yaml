openapi: 3.1.0
info:
  title: MissionCopilot-AI API
  version: 1.0.0
  description: >
    Contract between the iPhone app and the backend. People (dashboard) authenticate with a
    bearer token; enrolled phones sign every request with their Secure Enclave key and never hold
    a bearer token. The organization comes from the token or the enrolled device, never from the
    request. Only approved, device-signed items are uploaded. Errors use Problem Details (RFC 9457).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.example.org
    description: Placeholder; real host set at deployment
security:
  - bearerAuth: []
tags:
  - name: health
  - name: missions
  - name: sync
  - name: review
  - name: reporting
  - name: devices
paths:
  /v1/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/missions/{missionId}/pack:
    get:
      tags: [missions]
      operationId: getMissionPack
      security:
        - deviceSignature: []
      summary: Download the mission pack before going offline
      parameters:
        - $ref: "#/components/parameters/MissionId"
      responses:
        "410":
          $ref: "#/components/responses/ShredOrder"
        "200":
          description: The mission and its pack
          content:
            application/json:
              schema:
                type: object
                required: [mission, pack]
                properties:
                  mission:
                    $ref: "#/components/schemas/Mission"
                  pack:
                    $ref: "#/components/schemas/MissionPack"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/missions/{missionId}/sync:
    post:
      tags: [sync]
      operationId: uploadSyncBatch
      security:
        - deviceSignature: []
      summary: Upload approved, signed items from the phone outbox (idempotent)
      parameters:
        - $ref: "#/components/parameters/MissionId"
        - name: Idempotency-Key
          in: header
          required: true
          description: Stable id of this batch; retries with the same key are applied once
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncBatch"
      responses:
        "410":
          $ref: "#/components/responses/ShredOrder"
        "200":
          description: Batch stored; the receipt starts the retention clock on the phone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "409":
          description: Signature or hash chain does not verify
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: An item breaks an invariant (for example a sentence without facts)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/missions/{missionId}/submit:
    post:
      tags: [review]
      operationId: submitForReview
      security:
        - deviceSignature: []
      summary: Officer submits the approved report to the manager
      parameters:
        - $ref: "#/components/parameters/MissionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Approval"
      responses:
        "410":
          $ref: "#/components/responses/ShredOrder"
        "202":
          description: Submitted for manager review
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "422":
          description: Report has untraceable sentences
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/missions/{missionId}/review:
    post:
      tags: [review]
      operationId: reviewMission
      summary: Manager approves or rejects the mission report
      parameters:
        - $ref: "#/components/parameters/MissionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Approval"
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/missions/{missionId}/audit:
    get:
      tags: [reporting]
      operationId: getAuditTrail
      summary: Read the hash-chained audit trail of a mission
      parameters:
        - $ref: "#/components/parameters/MissionId"
      responses:
        "200":
          description: Audit events in order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/missions/{missionId}/export:
    get:
      tags: [reporting]
      operationId: exportMission
      summary: Export an approved mission, shaped like OC4IDS with risk flags and lineage
      parameters:
        - $ref: "#/components/parameters/MissionId"
      responses:
        "200":
          description: OC4IDS-shaped project document (see ADR 0011)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardsExport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/dashboard/metrics:
    get:
      tags: [reporting]
      operationId: getDashboardMetrics
      summary: Leadership metrics for the caller's organization
      responses:
        "200":
          description: Metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  missionsApproved:
                    type: integer
                  flagsRaised:
                    type: integer
                  flagsByRule:
                    type: object
                    additionalProperties:
                      type: integer
                  medianDaysToApproval:
                    type: number
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/devices/enrollment-codes:
    post:
      tags: [devices]
      operationId: issueEnrollmentCode
      summary: An admin issues a single-use code to enroll one person's phone (15 minutes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentCodeRequest"
      responses:
        "201":
          description: The code, shown once; only its hash is stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentCode"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/devices/enroll:
    post:
      tags: [devices]
      operationId: enrollDevice
      summary: A phone registers its Secure Enclave public key with a one-time code
      description: >
        Authenticated by the one-time code, not a token. The phone proves it holds the private
        key by signing the enrollment message. The device starts as pending until a manager
        approves it. Trust on first use: without App Attest the server cannot prove the key lives
        in a Secure Enclave.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceEnrollment"
      responses:
        "201":
          description: Enrolled, waiting for a manager's approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          description: The code is unknown, used or expired, or the proof does not verify
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: A manager lists the organization's phones, pending ones first
      responses:
        "200":
          description: Devices of the caller's organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/devices/{deviceId}/approve:
    post:
      tags: [devices]
      operationId: approveDevice
      summary: A manager approves a pending phone (never their own; a revoked phone stays revoked)
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: The device is active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Only a pending device can be approved
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/devices/{deviceId}/revoke:
    post:
      tags: [devices]
      operationId: revokeDevice
      summary: A manager or admin revokes a phone; its signed requests are refused from then on
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: The device is revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ES256 JWT from the configured issuer; iss, aud, sub, org, iat and exp are required. The organization (org) and user (sub) come only from this token, never from the path, query or body.
    deviceSignature:
      type: apiKey
      in: header
      name: X-Device-Signature
      description: >
        An enrolled, approved phone signs every request with its Secure Enclave key (ECDSA P-256,
        SHA-256, DER, base64). Headers X-Device-Id, X-Device-Seq (strictly increasing) and
        X-Device-Time (Unix seconds) are signed too; the signed message is defined in
        docs/security.md. Replays, old times and unknown or pending devices get 401. A revoked
        device's genuinely signed request gets 410 with a server-signed shred order (ADR 0012).
  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MissionId:
      name: missionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Not a member of this mission's team
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Not found in the caller's organization
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: Request body over the size limit (1 MiB by default)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ShredOrder:
      description: >
        This phone was revoked. The server-signed order tells it to destroy every mission it holds
        (ADR 0012). The phone checks the signature against the pinned server key and that the order
        names its own device id. Sent only to a genuinely signed request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ShredOrder"
    TooManyRequests:
      description: Too many requests from this client; retry after the given delay
      headers:
        Retry-After:
          description: Seconds to wait before the next request
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    EnrollmentCodeRequest:
      type: object
      additionalProperties: false
      required: [userId, deviceLabel]
      properties:
        userId:
          type: string
          description: The person whose phone this code may enroll
        deviceLabel:
          type: string
          maxLength: 80
    EnrollmentCode:
      type: object
      required: [code, expiresAt]
      properties:
        code:
          type: string
          description: Shown once; the server keeps only its hash
        expiresAt:
          type: string
          format: date-time
    DeviceEnrollment:
      type: object
      additionalProperties: false
      required: [code, publicKeyDER, proof]
      properties:
        code:
          type: string
        publicKeyDER:
          type: string
          contentEncoding: base64
          description: P-256 public key, SubjectPublicKeyInfo DER (CryptoKit derRepresentation)
        proof:
          type: string
          contentEncoding: base64
          description: ECDSA P-256 SHA-256 DER signature over the enrollment message
    Device:
      type: object
      required: [id, userId, label, status, enrolledAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
        label:
          type: string
        status:
          type: string
          enum: [pending, active, revoked]
        enrolledAt:
          type: string
          format: date-time
    Problem:
      type: object
      description: RFC 9457 Problem Details
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    ShredOrder:
      type: object
      description: >
        Problem Details with a signed order. The signature is ECDSA P-256 over SHA-256 (DER,
        base64) of "missioncopilot-shred-v1\n" + deviceId + "\n" + scope + "\n" + issuedAt.
      required: [type, title, status, order, signature]
      properties:
        type:
          type: string
          const: urn:missioncopilot:problem:shred-order
        title:
          type: string
        status:
          type: integer
          const: 410
        detail:
          type: string
        order:
          type: object
          additionalProperties: false
          required: [deviceId, scope, issuedAt]
          properties:
            deviceId:
              type: string
            scope:
              type: string
              const: all-missions
            issuedAt:
              type: integer
              description: Unix seconds, server time
        signature:
          type: string
          contentEncoding: base64
    Classification:
      type: string
      enum: [strictly_confidential, official_use_only, public]
    Base:
      type: object
      required: [id, createdAt, classification]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        classification:
          $ref: "#/components/schemas/Classification"
    Mission:
      allOf:
        - $ref: "#/components/schemas/Base"
        - type: object
          required: [projectRef, site, status]
          properties:
            projectRef:
              type: string
            site:
              type: string
            startDate:
              type: string
              format: date
            endDate:
              type: string
              format: date
            team:
              type: array
              items:
                type: string
            status:
              type: string
              enum: [preparing, in_field, drafting, approved, synced, confirmed, shredded]
    MissionPack:
      allOf:
        - $ref: "#/components/schemas/Base"
        - type: object
          properties:
            budget:
              type: number
            contractValue:
              type: number
            payments:
              type: array
              items:
                type: object
                properties:
                  date:
                    type: string
                    format: date
                  amount:
                    type: number
                  reference:
                    type: string
            milestones:
              type: array
              items:
                type: object
                properties:
                  title:
                    type: string
                  dueDate:
                    type: string
                    format: date
                  dateMet:
                    type: [string, "null"]
                    format: date
            lastReportSummary:
              type: string
            checklist:
              type: object
              description: Site checklist in XLSForm structure
    SourceDocument:
      allOf:
        - $ref: "#/components/schemas/Base"
        - type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [invoice, progress_report, letter, other]
            title:
              type: string
            language:
              type: string
            pageCount:
              type: integer
    Page:
      allOf:
        - $ref: "#/components/schemas/Base"
        - type: object
          required: [documentId, number]
          properties:
            documentId:
              type: string
              format: uuid
            number:
              type: integer
            text:
              type: string
            evidenceId:
              type: string
              format: uuid
    Evidence:
      allOf:
        - $ref: "#/components/schemas/Base"
        - type: object
          required: [kind, contentHash, prevHash, signature, capturedAt]
          description: Immutable. Content travels separately; this is the signed record.
          properties:
            kind:
              type: string
              enum: [photo, scan, audio]
            contentHash:
              type: string
              description: SHA-256, hex
            prevHash:
              type: string
            signature:
              type: string
              description: Secure Enclave P-256 signature, base64
            capturedAt:
              type: string
              format: date-time
            clockSource:
              type: string
            location:
              type: object
              properties:
                lat:
                  type: number
                lon:
                  type: number
    FieldNote:
      allOf:
        - $ref: "#/components/schemas/Base"
        - type: object
          required: [source, text]
          properties:
            source:
              type: string
              enum: [typed, debrief]
            text:
              type: string
            audioEvidenceId:
              type: string
              format: uuid
            consent:
              type: boolean
    RuleVersion:
      type: object
      required: [ruleId, version, source, threshold]
      description: Immutable
      properties:
        ruleId:
          type: string
          examples: [R068, MC-01]
        version:
          type: string
        source:
          type: string
        formula:
          type: string
        threshold:
          type: number
    Fact:
      allOf:
        - $ref: "#/components/schemas/Base"
        - type: object
          required: [name, value, sourceEvidenceIds, ruleVersion]
          description: Immutable. Created only by the rule engine, never by the model.
          properties:
            name:
              type: string
            value:
              type: [number, string]
            unit:
              type: string
            sourceEvidenceIds:
              type: array
              minItems: 1
              items:
                type: string
                format: uuid
            region:
              type: string
            ruleVersion:
              $ref: "#/components/schemas/RuleVersion"
    RiskFlag:
      allOf:
        - $ref: "#/components/schemas/Base"
        - type: object
          required: [ruleVersion, inputFactIds, computedValues, status]
          properties:
            ruleVersion:
              $ref: "#/components/schemas/RuleVersion"
            inputFactIds:
              type: array
              items:
                type: string
                format: uuid
            computedValues:
              type: object
              additionalProperties:
                type: number
            status:
              type: string
              enum: [raised, not_checked, dismissed]
            dismissalReason:
              type: string
    ReportSentence:
      allOf:
        - $ref: "#/components/schemas/Base"
        - type: object
          required: [section, text, factIds]
          properties:
            section:
              type: string
            text:
              type: string
            factIds:
              type: array
              minItems: 1
              description: A sentence without facts cannot be approved
              items:
                type: string
                format: uuid
    ReportDraft:
      allOf:
        - $ref: "#/components/schemas/Base"
        - type: object
          required: [template, version, sentences]
          properties:
            template:
              type: string
            version:
              type: integer
            sentences:
              type: array
              items:
                $ref: "#/components/schemas/ReportSentence"
    Approval:
      allOf:
        - $ref: "#/components/schemas/Base"
        - type: object
          required: [target, decision, signature]
          description: Immutable
          properties:
            target:
              type: string
              enum: [report_draft, label_change, flag_dismissal, mission_review]
            targetId:
              type: string
              format: uuid
            approverId:
              type: string
            decision:
              type: string
              enum: [approve, reject]
            reason:
              type: string
            signature:
              type: string
    AuditEvent:
      allOf:
        - $ref: "#/components/schemas/Base"
        - type: object
          required: [actor, action, prevHash]
          description: Immutable, hash-chained
          properties:
            actor:
              type: string
            action:
              type: string
            targetId:
              type: string
            details:
              type: object
            prevHash:
              type: string
    SyncBatch:
      type: object
      required: [deviceId, items]
      properties:
        deviceId:
          type: string
        items:
          type: object
          properties:
            evidence:
              type: array
              items:
                $ref: "#/components/schemas/Evidence"
            documents:
              type: array
              items:
                $ref: "#/components/schemas/SourceDocument"
            pages:
              type: array
              items:
                $ref: "#/components/schemas/Page"
            notes:
              type: array
              items:
                $ref: "#/components/schemas/FieldNote"
            facts:
              type: array
              items:
                $ref: "#/components/schemas/Fact"
            flags:
              type: array
              items:
                $ref: "#/components/schemas/RiskFlag"
            report:
              $ref: "#/components/schemas/ReportDraft"
            approvals:
              type: array
              items:
                $ref: "#/components/schemas/Approval"
            audit:
              type: array
              items:
                $ref: "#/components/schemas/AuditEvent"
    SyncReceipt:
      type: object
      required: [batchId, receivedAt, itemCount]
      properties:
        batchId:
          type: string
          format: uuid
        receivedAt:
          type: string
          format: date-time
        itemCount:
          type: integer
        alreadyApplied:
          type: boolean
          description: True when the same Idempotency-Key was seen before
    StandardsExport:
      type: object
      description: Shaped like OC4IDS (ADR 0011), plus riskFlags and lineage extensions
      required: [id, metrics]
      properties:
        id:
          type: string
        metrics:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                enum: [physicalProgress, financialProgress]
              observations:
                type: array
                items:
                  type: object
                  properties:
                    measure:
                      type: number
                    unit:
                      type: string
        milestones:
          type: array
          items:
            type: object
        documents:
          type: array
          items:
            type: object
        riskFlags:
          type: array
          items:
            $ref: "#/components/schemas/RiskFlag"
        lineage:
          type: array
          items:
            type: object
